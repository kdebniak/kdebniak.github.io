<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boat Learner | Sailing Simulator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ensuring the game takes up the full screen area */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a2a3a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #0077be; /* Deep Sea Blue */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }

        /* The Dashboard Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #F4C2C2; /* Matching your portfolio pink */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            min-width: 180px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .stat-label {
            font-size: 0.8em;
            text-transform: uppercase;
            color: #666;
            display: block;
            margin-top: 5px;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #2D1A1E;
            display: block;
        }

        /* On-Screen Instructions */
        #controls-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9em;
            pointer-events: none;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .key {
            display: inline-block;
            border: 1px solid white;
            border-radius: 4px;
            padding: 2px 6px;
            margin: 0 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <span class="stat-label">Score</span>
            <span id="points" class="stat-value">0</span>
            
            <span class="stat-label">Boat Speed</span>
            <span id="speed" class="stat-value">0.0</span>
            
            <span class="stat-label">Compass Heading</span>
            <span id="heading" class="stat-value">0°</span>
            
            <span class="stat-label">Sail Trim</span>
            <div style="width: 100%; height: 10px; background: #ddd; border-radius: 5px; margin-top: 5px;">
                <div id="trim-bar" style="width: 50%; height: 100%; background: #F4C2C2; border-radius: 5px; transition: width 0.1s;"></div>
            </div>
        </div>

        <canvas id="sailingCanvas"></canvas>

        <div id="controls-overlay">
            Steer: <span class="key">←</span> <span class="key">→</span> | 
            Trim Sail: <span class="key">↑</span> <span class="key">↓</span>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
