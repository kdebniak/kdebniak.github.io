<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karolina Debniak | Portfolio</title>
    <style>
        :root {
            --pink-dark: #3E2A2F;      /* Dark text color for readability */
            --pink-main: #FADADD;      /* Classic pastel pink for header */
            --pink-accent: #F4C2C2;    /* Slightly darker pink for buttons/borders */
            --bg-light: #FFF5F7;       /* Very light pink background */
            --white: #ffffff;
            --muted-text: #8C7A7D;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--pink-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
        }
        header {
            background-color: var(--pink-main);
            border-bottom: 5px solid var(--pink-accent);
            padding: 3rem 10%;
            text-align: left;
        }
        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }
        
        .profile-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--white);
            box-shadow: 0 4px 15px rgba(244, 194, 194, 0.5);
        }

        .header-text {
            flex: 1; 
        }
        h1 { margin: 0; font-size: 2.8rem; color: var(--pink-dark); }
        .headline { font-size: 1.2rem; color: var(--pink-dark); font-weight: 600; margin-top: 0.5rem; }
        
        .main-container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        .card {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(244, 194, 194, 0.2);
            margin-bottom: 2rem;
        }
        h2 { border-left: 4px solid var(--pink-accent); padding-left: 1rem; margin-top: 0; font-size: 1.5rem; color: var(--pink-dark); }
        
        .exp-item { margin-bottom: 1.5rem; }
        .exp-title { font-weight: 700; color: var(--pink-dark); display: block; font-size: 1.1rem;}
        .exp-meta { color: var(--muted-text); font-size: 0.9rem; margin-bottom: 0.5rem; display: block; font-style: italic;}
        
        ul { padding-left: 20px; margin-top: 5px; }
        li { margin-bottom: 8px; }

        .skill-tag {
            display: inline-block;
            background: #FDF0F2;
            color: var(--pink-dark);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            margin: 0.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--pink-accent);
        }
        .contact-btn {
            display: inline-block;
            background-color: var(--white);
            color: var(--pink-dark);
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            margin-top: 1rem;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .contact-btn:hover {
            background-color: var(--pink-accent);
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .header-container { flex-direction: column; text-align: center; }
            .header-text { margin-bottom: 1.5rem; }
            .main-container { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
            .profile-photo { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>

<header>

        <img src="headshot.png" alt="Karolina Debniak Headshot" class="profile-photo">
