<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sailing Final Prep</title>
    <style>
        :root {
            --bg-color: #e0f2fe; /* Light water blue */
            --card-bg: #ffffff; /* Clean white for cards */
            --text-main: #2d3748; /* Charcoal from portfolio */
            --accent-pink: #e83e8c; /* Primary vivid pink */
            --hover-pink: #d81b60; /* Darker pink for hovers */
            --ocean-blue: #0284c7; /* Deeper blue for headings/water theme */
            --correct: #10b981; /* Green for correct */
            --incorrect: #ef4444; /* Red for incorrect */
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app-container {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.15); /* Soft blue shadow */
            overflow: hidden;
            position: relative;
            padding: 2rem;
            border: 2px solid #bae6fd;
        }
        /* Progress Bar */
        #progress-container {
            width: 100%;
            background-color: #f1f5f9;
            height: 8px;
            position: absolute;
            top: 0;
            left: 0;
        }
        #progress-bar {
            height: 100%;
            background-color: var(--accent-pink);
            width: 0%;
            transition: width 0.3s ease;
        }
        /* Quiz Elements */
        h1 { 
            text-align: center; 
            color: var(--ocean-blue); 
            margin-top: 0; 
            font-size: 2.2rem;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed #bae6fd;
        }

        #question-counter { 
            font-size: 1rem; 
            color: #64748b; 
            font-weight: 600;
        }

        #score-tracker {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-pink);
            background: #fdf2f8;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid #fbcfe8;
        }

        #question-text { 
            font-size: 1.25rem; 
            margin-bottom: 2rem; 
            line-height: 1.5; 
            font-weight: 600; 
            color: var(--text-main);
        }
        
        .option-btn {
            display: block;
            width: 100%;
            background-color: #f8fafc;
            color: var(--text-main);
            border: 2px solid #e2e8f0;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover { 
            background-color: #fdf2f8; 
            border-color: var(--accent-pink); 
            color: var(--dark-pink);
        }
        .option-btn:disabled { cursor: not-allowed; }
        
        .correct-answer { 
            background-color: var(--correct) !important; 
            border-color: var(--correct) !important; 
            color: white !important;
        }
        .wrong-answer { 
            background-color: var(--incorrect) !important; 
            border-color: var(--incorrect) !important; 
            color: white !important;
        }
        
        #next-btn, #retake-btn, #back-btn {
            background-color: var(--accent-pink);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            display: none;
            transition: background-color 0.2s;
        }
        #next-btn:hover, #retake-btn:hover { background-color: var(--hover-pink); }
        
        #back-btn { background-color: var(--ocean-blue); }
        #back-btn:hover { background-color: #0369a1; }
        
        #result-screen { display: none; text-align: center; }
        #score-display { font-size: 4rem; font-weight: bold; color: var(--accent-pink); margin: 1rem 0; }
        
        .nav-link { 
            color: var(--ocean-blue); 
            text-decoration: none; 
            font-size: 0.95rem; 
            display: block; 
            text-align: center; 
            margin-top: 2rem; 
            font-weight: 600;
        }
        .nav-link:hover { color: var(--accent-pink); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="progress-container"><div id="progress-bar"></div></div>
    
    <div id="quiz-screen">
        <h1>Sailing Final Prep</h1>
        <div class="header-info">
            <div id="question-counter">Question 1 of 25</div>
            <div id="score-tracker">Points: <span id="current-score">0</span></div>
        </div>
        <div id="question-text">Loading question...</div>
        <div id="options-container"></div>
        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="result-screen">
        <h1>Final Score</h1>
        <p>You completed the study session.</p>
        <div id="score-display">0%</div>
        <p id="feedback-message"></p>
        <button id="retake-btn" onclick="startQuiz()">Retake Quiz</button>
        <button id="back-btn" onclick="window.location.href='index.html'" style="display:block;">Back to Portfolio</button>
    </div>
    
    <a href="index.html" class="nav-link">&larr; Return to Portfolio</a>
</div>

<script>
    const questions = [
        { q: "What is the left side of the boat called when facing forward?", options: ["Starboard", "Port", "Bow", "Stern"], answer: 1 },
        { q: "What color is the navigation light on the starboard side?", options: ["Red", "Green", "White", "Yellow"], answer: 1 },
        { q: "What color is the navigation light on the port side?", options: ["Red", "Green", "White", "Yellow"], answer: 0 },
        { q: "What is the front part of a boat called?", options: ["Stern", "Aft", "Bow", "Hull"], answer: 2 },
        { q: "What is the rear part of a boat called?", options: ["Stern", "Bow", "Keel", "Port"], answer: 0 },
        { q: "What maneuver involves turning the bow of the boat through the wind?", options: ["Jibing", "Tacking", "Reefing", "Heeling"], answer: 1 },
        { q: "What maneuver involves turning the stern of the boat through the wind?", options: ["Jibing", "Tacking", "Luffing", "Mooring"], answer: 0 },
        { q: "What is the primary purpose of a halyard?", options: ["To steer the boat", "To trim the sail", "To hoist a sail", "To secure the anchor"], answer: 2 },
        { q: "Which line is used to control the angle of the sail to the wind?", options: ["Halyard", "Sheet", "Painter", "Spring line"], answer: 1 },
        { q: "What is the heavy fin or ballast at the bottom of a sailboat that prevents it from capsizing?", options: ["Rudder", "Keel", "Transom", "Boom"], answer: 1 },
        { q: "According to the 'Red Right Returning' rule, where should you keep the red buoys when returning from the open sea?", options: ["On your port side", "On your starboard side", "Directly ahead", "Behind you"], answer: 1 },
        { q: "When two sailboats meet on different tacks, which vessel has the right of way?", options: ["The vessel on the port tack", "The vessel on the starboard tack", "The larger vessel", "The faster vessel"], answer: 1 },
        { q: "What does 'draft' refer to in boating?", options: ["The speed of the wind", "The vertical distance from the waterline to the lowest point of the boat", "The height of the mast", "The width of the boat"], answer: 1 },
        { q: "What knot is commonly used to form a secure, fixed loop at the end of a rope?", options: ["Figure-eight knot", "Square knot", "Bowline", "Clove hitch"], answer: 2 },
        { q: "What knot is best for tying a line to a piling or post?", options: ["Clove hitch", "Bowline", "Cleat hitch", "Sheet bend"], answer: 0 },
        { q: "What is the term for a boat leaning to one side due to the force of the wind?", options: ["Yawing", "Pitching", "Heeling", "Broaching"], answer: 2 },
        { q: "What is the forward-facing edge of a triangular sail called?", options: ["Leech", "Foot", "Head", "Luff"], answer: 3 },
        { q: "What is the trailing edge of a sail called?", options: ["Luff", "Leech", "Tack", "Clew"], answer: 1 },
        { q: "What is the bottom edge of a sail called?", options: ["Foot", "Leech", "Luff", "Head"], answer: 0 },
        { q: "What are the small pieces of yarn attached to a sail to indicate airflow called?", options: ["Batten", "Telltales", "Grommets", "Cringles"], answer: 1 },
        { q: "What is the purpose of a boom vang?", options: ["To hoist the main sail", "To hold the boom up", "To pull the boom down and flatten the sail", "To secure the jib"], answer: 2 },
        { q: "What does it mean to 'reef' a sail?", options: ["To take it down completely", "To wash it", "To reduce its area in high winds", "To raise it to the top of the mast"], answer: 2 },
        { q: "What is the fitting used to secure a line on the deck or dock called?", options: ["Winch", "Cleat", "Block", "Shackle"], answer: 1 },
        { q: "Which term describes the steering wheel or tiller used to control the rudder?", options: ["Helm", "Keel", "Binnacle", "Transom"], answer: 0 },
        { q: "What happens when a sail is 'luffing'?", options: ["It is pulled perfectly tight", "It is flapping in the wind and generating no power", "It is submerged in water", "It is tearing apart"], answer: 1 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const counter = document.getElementById('question-counter');
    const progressBar = document.getElementById('progress-bar');
    const scoreDisplay = document.getElementById('score-display');
    const feedbackMessage = document.getElementById('feedback-message');
    const currentScoreDisplay = document.getElementById('current-score');

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        currentScoreDisplay.innerText = score;
        quizScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        nextBtn.style.display = 'none';
        const currentQ = questions[currentQuestionIndex];
        
        counter.innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        questionText.innerText = currentQ.q;
        
        // Update Progress Bar
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        optionsContainer.innerHTML = '';
        currentQ.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = option;
            button.onclick = () => selectOption(index, button);
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex, btn) {
        if (answered) return;
        answered = true;
        
        const currentQ = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        
        // Disable all buttons
        buttons.forEach(b => b.disabled = true);

        if (selectedIndex === currentQ.answer) {
            btn.classList.add('correct-answer');
            score++;
            currentScoreDisplay.innerText = score; // Update the live counter
        } else {
            btn.classList.add('wrong-answer');
            buttons[currentQ.answer].classList.add('correct-answer');
        }

        nextBtn.style.display = 'block';
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.innerText = 'See Final Score';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        progressBar.style.width = '100%';
        
        const percentage = Math.round((score / questions.length) * 100);
        scoreDisplay.innerText = `${percentage}%`;
        
        if(percentage >= 90) feedbackMessage.innerText = "Captain Ready! Incredible job.";
        else if(percentage >= 75) feedbackMessage.innerText = "Solid understanding. Keep reviewing those tricky maneuvers!";
        else feedbackMessage.innerText = "Looks like you need to hit the water a bit more before setting sail.";
    }

    // Start the app
    startQuiz();
</script>

</body>
</html>
